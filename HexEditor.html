<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Editor</title>
<style>
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

* {
    background-color: #FFF;
    color: #010101;
}

.title {
    background-color: #E1E1E1;
    color: #6C6C6C;
}

.on-edit {
    background-color: #F8F7C5;
}

.code {
    white-space: pre;
    overflow-x: auto;
    font-family: monospace;
}

.footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #FCFCFC;
    padding: 15px;
    text-align: center;
    z-index: 1023;
}
</style>
</head>
<body>

<!-- Get & Show -->
<input type="file" id="f">
<p id="hex-area" class="code"></p>

<!-- Console -->
<div class="footer">

<svg width="410" height="80">
    <!-- move -->
    <rect id="key-u" x="40" y="10" width="30" height="30" fill="#FFF" stroke="#000" stroke-width="1"/>
    <rect id="key-d" x="40" y="40" width="30" height="30" fill="#FFF" stroke="#000" stroke-width="1"/>
    <rect id="key-l" x="10" y="40" width="30" height="30" fill="#FFF" stroke="#000" stroke-width="1"/>
    <rect id="key-r" x="70" y="40" width="30" height="30" fill="#FFF" stroke="#000" stroke-width="1"/>
    
    <text x="55" y="25" text-anchor="middle" dominant-baseline="middle" font-size="20" pointer-events="none">&uarr;</text>
    <text x="55" y="55" text-anchor="middle" dominant-baseline="middle" font-size="20" pointer-events="none">&darr;</text>
    <text x="25" y="55" text-anchor="middle" dominant-baseline="middle" font-size="20" pointer-events="none">&larr;</text>
    <text x="85" y="55" text-anchor="middle" dominant-baseline="middle" font-size="20" pointer-events="none">&rarr;</text>
</svg>

</div>
<script>
// State
let now = 0;
let file = null;
let bytes = null;

function dec2hex(dec, len) {
    const s = dec.toString(16).toUpperCase();
    if (len !== undefined) return s.padStart(len, '0');
    return s;
}

function move(step) {
    if (file !== null) {
        now += step;
        refresh();
    }
}

function refresh() {
    // Info
    let num = 0;
    const len = bytes.length;
    const digits = dec2hex(len).length; // Quickly calculate the number of hexadecimal digits using a string
    
    // Range Limit
    if (now < 0) now = 0;
    if (now >= len) now = len - 1;
    
    // Traverse
    let output = [`<span class="title">${' '.repeat(digits)} 00 01 02 03 04 05 06 07</span>\n`];
    for (let i of bytes) {
        /*
        8 bytes per line
        
        Divide:
        000 AE 10 45 36 F6 95 01 37:
        "000" + " AE" + " 10" + ... + " 37" + "\n"
        
        */
        
        // Start of a line
        if (num % 8 == 0) {
            output.push(`<span class="title">${dec2hex(num, digits)}</span>`);
        }
        // Block
        if (num != now) {
            // Plain
            output.push(` ${dec2hex(i, 2)}`);
        } else {
            // On edit
            output.push(` <span class="on-edit">${dec2hex(i, 2)}</span>`);
        }
        // End of a line
        if ((num + 1) % 8 == 0) {
            output.push("\n");
        }
        num++;
    }
    
    // Show
    document.getElementById("hex-area").innerHTML = output.join("");
};

document.getElementById('f').onchange = async e => {
    // Reset
    now = 0;
    
    // Read
    file = e.target.files[0];
    const buf = await file.arrayBuffer(); // ArrayBuffer
    bytes = Array.from(new Uint8Array(buf)); // List of bytes
    
    refresh();
}

window.addEventListener('load', () => {
    // The SVG button (caters to mobile users)
    document.getElementById('key-u').addEventListener('click', () => move(-8));
    document.getElementById('key-d').addEventListener('click', () => move(8));
    document.getElementById('key-l').addEventListener('click', () => move(-1));
    document.getElementById('key-r').addEventListener('click', () => move(1));
    
    // The computer version is more convenient
    document.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'ArrowUp') { move(-8); }
        else if (e.key === 's' || e.key === 'ArrowDown') { move(8); }
        else if (e.key === 'a' || e.key === 'ArrowLeft') { move(-1); }
        else if (e.key === 'd' || e.key === 'ArrowRight') { move(1); }
    });
});
</script>

</body>
</html>
