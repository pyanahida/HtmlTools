<body>
<div id="err"></div>
<div id="wrap">
  <svg id="stage" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>

  <div id="combo"></div>
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>HP <span id="hp">80</span></div>

  </div>

  <div id="home">
    <h1>AWGZ</h1>
    <div class="row">
      <label>流速 s</label>
      <input id="speedInput" type="number" min="5" max="100" value="20">
    </div>
    <div class="hint">5 ~ 100，实际速度 = 10s px/s</div>
    <div class="row">
      <label>模式</label>
      <select id="modeSelect">
        <option value="0">极限 P±20 G20-40</option>
        <option value="1">严格 P±40 G40-70</option>
        <option value="2" selected>一般 P±60 G60-90</option>
        <option value="3">轻松 P±80 G80-110</option>
        <option value="4">闭眼 P±110 G110-140</option>
        <option value="5">自由 P±160 G160-250</option>
      </select>
    </div>
    <button id="loadBtn">导入谱面</button>
    <input id="fileInput" type="file" accept=".xml" style="display:none">
    <div class="hint" id="songName"></div>
  </div>

  <div id="result">
    <h2 id="resultTitle">RESULT</h2>
    <div class="line">SCORE <span id="rScore">0</span></div>
    <div class="line">MAX COMBO <span id="rCombo">0</span></div>
    <div class="line">PERFECT <span id="rPerfect">0</span></div>
    <div class="line">GOOD <span id="rGood">0</span></div>
    <div class="line">MISS <span id="rMiss">0</span></div>
    <button id="backBtn">确认</button>
  </div>
</div>

<script>
/* ===== 页面内错误显示 ===== */
const errEl = document.getElementById('err');
function showErr(msg){
  errEl.style.display = 'block';
  errEl.textContent = String(msg);
}
window.onerror = function(m, src, line, col){
  showErr('Error: ' + m + ' @' + line + ':' + col);
};

/* ================= 基础参数 ================= */
const TOUCH_RADIUS = 100;

const MAX_HP = 80;
const SCORE_PERFECT = 5;
const SCORE_GOOD = 3;
const HP_MISS = -5;
const END_DELAY = 1.0;

const MODES = [
  { p: 20,  g: 40  },
  { p: 40,  g: 70  },
  { p: 60,  g: 90  },
  { p: 80,  g: 110 },
  { p: 110, g: 140 },
  { p: 160, g: 250 }
];

let noteSpeed = 200;
let perfectWindow = 0.060;
let goodWindow = 0.090;

const svg = document.getElementById('stage');
const comboEl = document.getElementById('combo');
const songNameEl = document.getElementById('songName');
const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');
const hpFillEl = document.getElementById('hpfill');

const homeEl = document.getElementById('home');
const resultEl = document.getElementById('result');
const resultTitleEl = document.getElementById('resultTitle');
const rScoreEl = document.getElementById('rScore');
const rComboEl = document.getElementById('rCombo');
const rPerfectEl = document.getElementById('rPerfect');
const rGoodEl = document.getElementById('rGood');
const rMissEl = document.getElementById('rMiss');
const speedInput = document.getElementById('speedInput');
const modeSelect = document.getElementById('modeSelect');
const fileInput = document.getElementById('fileInput');

let chart = null;
let points = {};
let lines  = [];
let notes  = [];   // 统一：t/d/h

let score = 0;
let hp = MAX_HP;
let combo = 0, maxCombo = 0;
let perfectCount = 0, goodCount = 0, missCount = 0;

/* 输入状态 */
const heldKeys = new Set();
const heldRails = new Set();
const touchMap = new Map();
const railHoldCount = new Map();

/* 按住计数（键盘+触屏统一），用于 hold 尾判 out 检测“计数变化” */
const holdCount = new Map();   // rail -> 计数

function t2s(t){ return t * 60 / chart.bpm; }
function s2t(s){ return s * chart.bpm / 60; }
function startTime(){ return -chart.bpm / 30; }

/* ================= 解析 XML ================= */
function parseChart(xmlDoc){
  const root = xmlDoc.querySelector('data');
  const c = {
    name: root.getAttribute('name') || '',
    bpm: parseFloat(root.getAttribute('bpm')) || 60,
    points: {},
    lines: [],
    notes: [],
    events: []
  };

  root.querySelectorAll('points > p').forEach(p=>{
    c.points[p.getAttribute('id')] = {
      x: parseFloat(p.getAttribute('x')),
      y: parseFloat(p.getAttribute('y')),
      moves: []
    };
  });

  root.querySelectorAll('lines > line').forEach(l=>{
    c.lines.push({
      id: l.getAttribute('id'),
      start: l.getAttribute('start'),
      end: l.getAttribute('end'),
      rails: (l.getAttribute('rails')||'').trim().split(/\s+/).filter(Boolean),
      alpha: l.hasAttribute('alpha') ? parseFloat(l.getAttribute('alpha')) : 1,
      railBorderAlpha: l.hasAttribute('railBorderAlpha') ? parseFloat(l.getAttribute('railBorderAlpha')) : 0.5
    });
  });

  // t / d / h
  root.querySelectorAll('taps > t, taps > d, taps > h').forEach(el=>{
    const tag = el.tagName.toLowerCase();
    if(tag === 'h'){
      c.notes.push({
        type: 'hold',
        line: el.getAttribute('online'),
        rail: el.getAttribute('onrail'),
        startTime: parseFloat(el.getAttribute('startTime')),
        endTime: parseFloat(el.getAttribute('endTime')),
        endType: (el.getAttribute('endType') || 'free')
      });
    } else {
      c.notes.push({
        type: tag === 'd' ? 'drag' : 'tap',
        line: el.getAttribute('online'),
        rail: el.getAttribute('onrail'),
        time: parseFloat(el.getAttribute('time'))
      });
    }
  });

  root.querySelectorAll('events > pointmove').forEach(m=>{
    c.events.push({
      kind: 'pointmove',
      obj: m.getAttribute('obj'),
      startTime: parseFloat(m.getAttribute('startTime')),
      endTime: parseFloat(m.getAttribute('endTime')),
      toX: parseFloat(m.getAttribute('toX')),
      toY: parseFloat(m.getAttribute('toY'))
    });
  });

  root.querySelectorAll('events > lineAlphaChange').forEach(el=>{
    c.events.push({
      kind: 'lineAlphaChange',
      startTime: parseFloat(el.getAttribute('startTime')),
      endTime: parseFloat(el.getAttribute('endTime')),
      endAlpha: parseFloat(el.getAttribute('endAlpha'))
    });
  });

  root.querySelectorAll('events > railBorderAlphaChange').forEach(el=>{
    c.events.push({
      kind: 'railBorderAlphaChange',
      startTime: parseFloat(el.getAttribute('startTime')),
      endTime: parseFloat(el.getAttribute('endTime')),
      endAlpha: parseFloat(el.getAttribute('endAlpha'))
    });
  });

  return c;
}

/* ================= 初始化运行时 ================= */
function buildRuntime(c){
  chart = c;
  points = {};
  for(const id in c.points){
    points[id] = { x:c.points[id].x, y:c.points[id].y,
                   baseX:c.points[id].x, baseY:c.points[id].y, moves:[] };
  }
  c.events.forEach(e=>{
    if(e.kind==='pointmove' && points[e.obj]) points[e.obj].moves.push(e);
  });
  for(const id in points){
    points[id].moves.sort((a,b)=>a.startTime-b.startTime);
  }

  lines = c.lines.map(l=>{
    const alphaEvents = c.events
      .filter(e=>e.kind==='lineAlphaChange')
      .sort((a,b)=>a.startTime-b.startTime);
    const rbEvents = c.events
      .filter(e=>e.kind==='railBorderAlphaChange')
      .sort((a,b)=>a.startTime-b.startTime);
    return {
      id: l.id, startId: l.start, endId: l.end, rails: l.rails.slice(),
      baseAlpha: l.alpha,
      baseRailBorderAlpha: l.railBorderAlpha,
      alpha: l.alpha,
      railBorderAlpha: l.railBorderAlpha,
      alphaEvents,
      railBorderAlphaEvents: rbEvents
    };
  });

  notes = c.notes.map(n=>{
    if(n.type === 'hold'){
      const t = n.endTime - n.startTime;
      return {
        type: 'hold',
        lineId: n.line,
        rail: n.rail,
        startTime: n.startTime,
        endTime: n.endTime,
        endType: n.endType,
        duration: t,
        // none 的有效结束
        effEnd: n.endType === 'none' ? (n.endTime - t/16) : n.endTime,
        // 状态
        headHit: false,      // 头判已命中
        active: false,       // 当前处于按住状态
        failed: false,       // 中途失败
        done: false,         // 整体完成（成功或失败）
        comboAcc: 0,         // 已累加的中间 combo 数（按 0.25 拍）
        // 记录按住计数历史，用于 out 尾判
        tailCountAt: null,   // 尾判窗口内的初始计数快照
        el: null, tailEl: null
      };
    } else {
      return {
        type: n.type,
        lineId: n.line,
        rail: n.rail,
        time: n.time,
        hit: false,
        missed: false,
        el: null
      };
    }
  });

  songNameEl.textContent = c.name ? (c.name + '  BPM:' + c.bpm) : '';
}

/* ================= 点位置 ================= */
function pointPos(p, nowTime){
  let x = p.baseX, y = p.baseY;
  for(const m of p.moves){
    if(nowTime <= m.startTime) break;
    if(nowTime >= m.endTime){ x = m.toX; y = m.toY; continue; }
    const span = m.endTime - m.startTime;
    const k = span<=0 ? 1 : (nowTime - m.startTime)/span;
    x = x + (m.toX - x) * k;
    y = y + (m.toY - y) * k;
    break;
  }
  return {x,y};
}

function applyAlphaEvents(base, events, nowTime){
  let val = base;
  for(const e of events){
    if(nowTime <= e.startTime) break;
    if(nowTime >= e.endTime){ val = e.endAlpha; continue; }
    const span = e.endTime - e.startTime;
    const k = span<=0 ? 1 : (nowTime - e.startTime)/span;
    val = val + (e.endAlpha - val) * k;
    break;
  }
  return val;
}

/* ================= 判定线几何 ================= */
function lineGeom(line, nowTime){
  const p0 = pointPos(points[line.startId], nowTime);
  const p1 = pointPos(points[line.endId], nowTime);
  let dx = p1.x - p0.x, dy = p1.y - p0.y;
  let len = Math.hypot(dx,dy);
  if(len < 1e-6){ dx=1; dy=0; len=1; }
  const ux = dx/len, uy = dy/len;
  const vx = -uy, vy = ux;
  return {p0,p1,ux,uy,vx,vy,len};
}

function railCenter(g, railIndex, railCount){
  const seg = g.len / railCount;
  const d = seg * (railIndex + 0.5);
  return { x: g.p0.x + g.ux*d, y: g.p0.y + g.uy*d };
}

/* ================= 渲染 ================= */
let svgLines = {};

function buildSvgForLines(){
  svg.innerHTML = '';
  svgLines = {};
  lines.forEach(l=>{
    const railCount = l.rails.length;

    const lineEl = document.createElementNS('http://www.w3.org/2000/svg','line');
    lineEl.setAttribute('stroke','#fff');
    lineEl.setAttribute('stroke-width','2');
    svg.appendChild(lineEl);

    const borders = [];
    for(let i=0;i<=railCount;i++){
      const el = document.createElementNS('http://www.w3.org/2000/svg','line');
      el.setAttribute('stroke','#808080');
      el.setAttribute('stroke-width','1');
      svg.appendChild(el);
      borders.push(el);
    }

    const railLabels = [];
    const g0 = lineGeom(l, startTime());
    l.rails.forEach((letter, i)=>{
      const el = document.createElementNS('http://www.w3.org/2000/svg','text');
      el.textContent = letter;
      el.setAttribute('fill','#fff');
      el.setAttribute('font-size','14');
      el.setAttribute('font-family','monospace');
      el.setAttribute('text-anchor','middle');
      el.setAttribute('dominant-baseline','middle');
      const c0 = railCenter(g0, i, railCount);
      el.setAttribute('x', c0.x);
      el.setAttribute('y', c0.y);
      svg.appendChild(el);
      railLabels.push(el);
    });

    // 音符元素
    notes.forEach(n=>{
      if(n.lineId !== l.id) return;
      if(n.type === 'hold'){
        // 主体矩形
        const el = document.createElementNS('http://www.w3.org/2000/svg','rect');
        el.setAttribute('fill','#fff');
        el.setAttribute('opacity','0');
        svg.appendChild(el);
        n.el = el;
        // 尾端描边
        const tailEl = document.createElementNS('http://www.w3.org/2000/svg','line');
        tailEl.setAttribute('stroke','#fff');
        tailEl.setAttribute('stroke-width','4');
        tailEl.setAttribute('opacity','0');
        svg.appendChild(tailEl);
        n.tailEl = tailEl;
      } else {
        const el = document.createElementNS('http://www.w3.org/2000/svg','rect');
        el.setAttribute('fill','#fff');
        el.setAttribute('opacity','0');
        svg.appendChild(el);
        n.el = el;
      }
    });

    svgLines[l.id] = { lineEl, borders, railLabels, railCount };
  });
}

const FAR = 5000;
function setInfiniteLine(el, cx, cy, ux, uy){
  el.setAttribute('x1', cx - ux*FAR);
  el.setAttribute('y1', cy - uy*FAR);
  el.setAttribute('x2', cx + ux*FAR);
  el.setAttribute('y2', cy + uy*FAR);
}

/* 计算音符在轨道上的落点（沿法向偏移 dist） */
function notePos(g, railIndex, railCount, dist){
  const center = railCenter(g, railIndex, railCount);
  return {
    x: center.x - g.vx * dist,
    y: center.y - g.vy * dist
  };
}

function render(nowTime){
  for(const l of lines){
    const g = lineGeom(l, nowTime);
    const store = svgLines[l.id];
    if(!store) continue;
    const railCount = store.railCount;

    l.alpha = applyAlphaEvents(l.baseAlpha, l.alphaEvents, nowTime);
    l.railBorderAlpha = applyAlphaEvents(l.baseRailBorderAlpha, l.railBorderAlphaEvents, nowTime);

    store.lineEl.setAttribute('opacity', l.alpha);
    store.borders.forEach(b=>{
      b.setAttribute('stroke', 'rgba(128,128,128,' + l.railBorderAlpha + ')');
    });

    setInfiniteLine(store.lineEl, g.p0.x, g.p0.y, g.ux, g.uy);

    const seg = g.len / railCount;
    for(let i=0;i<=railCount;i++){
      const d = seg * i;
      const bx = g.p0.x + g.ux*d;
      const by = g.p0.y + g.uy*d;
      const el = store.borders[i];
      el.setAttribute('x1', bx - g.vx*FAR);
      el.setAttribute('y1', by - g.vy*FAR);
      el.setAttribute('x2', bx + g.vx*FAR);
      el.setAttribute('y2', by + g.vy*FAR);
    }

    for(let i=0;i<railCount;i++){
      const c = railCenter(g, i, railCount);
      const el = store.railLabels[i];
      el.setAttribute('x', c.x);
      el.setAttribute('y', c.y);
    }
  }

  const angCache = {};
  notes.forEach(n=>{
    if(!n.el) return;
    const l = lines.find(x=>x.id===n.lineId);
    if(!l){ n.el.setAttribute('opacity','0'); if(n.tailEl) n.tailEl.setAttribute('opacity','0'); return; }
    const g = lineGeom(l, nowTime);
    const railCount = l.rails.length;
    const railIndex = l.rails.indexOf(n.rail);
    if(railIndex < 0){ n.el.setAttribute('opacity','0'); if(n.tailEl) n.tailEl.setAttribute('opacity','0'); return; }
    const rectW = g.len / railCount;
    const ang = Math.atan2(g.uy, g.ux) * 180/Math.PI;

    if(n.type === 'hold'){
      if(n.done && !n.failed){
        n.el.setAttribute('opacity','0');
        if(n.tailEl) n.tailEl.setAttribute('opacity','0');
        return;
      }
      // 头端 dist（startTime）
      const distHead = noteSpeed * t2s(n.startTime - nowTime);
      // 尾端 dist（endTime）
      const distTail = noteSpeed * t2s(n.endTime - nowTime);
      const pHead = notePos(g, railIndex, railCount, distHead);
      const pTail = notePos(g, railIndex, railCount, distTail);

      // 主体：用矩形表示，从 pTail 到 pHead
      // 中心点取中点，长边沿判定线法向
      const cx = (pHead.x + pTail.x) / 2;
      const cy = (pHead.y + pTail.y) / 2;
      const length = Math.hypot(pHead.x - pTail.x, pHead.y - pTail.y);

      n.el.setAttribute('x', cx - rectW/2);
      n.el.setAttribute('y', cy - length/2);
      n.el.setAttribute('width', rectW);
      n.el.setAttribute('height', length);
      const rectAng = Math.atan2(g.vy, g.vx) * 180/Math.PI;
      n.el.setAttribute('transform', `rotate(${rectAng} ${cx} ${cy})`);

      // 透明度：failed 时 30%
      n.el.setAttribute('opacity', n.failed ? '0.3' : '1');

      // 尾端 stroke 颜色
      let tailColor = '#fff';
      if(n.endType === 'free') tailColor = '#f00';
      else if(n.endType === 'none') tailColor = '#00e';
      n.tailEl.setAttribute('stroke', tailColor);
      // 尾端线段：垂直于法向（沿判定线方向），位于 pTail
      n.tailEl.setAttribute('x1', pTail.x - g.ux * rectW/2);
      n.tailEl.setAttribute('y1', pTail.y - g.uy * rectW/2);
      n.tailEl.setAttribute('x2', pTail.x + g.ux * rectW/2);
      n.tailEl.setAttribute('y2', pTail.y + g.uy * rectW/2);
      n.tailEl.setAttribute('opacity', n.failed ? '0.3' : '1');

    } else {
      if(n.hit || n.missed){ n.el.setAttribute('opacity','0'); return; }
      const rectH = n.type === 'drag' ? rectW / 15 : rectW / 6;
      const dist = noteSpeed * t2s(n.time - nowTime);
      const p = notePos(g, railIndex, railCount, dist);
      n.el.setAttribute('x', p.x - rectW/2);
      n.el.setAttribute('y', p.y - rectH/2);
      n.el.setAttribute('width', rectW);
      n.el.setAttribute('height', rectH);
      n.el.setAttribute('opacity','1');
      n.el.setAttribute('transform', `rotate(${ang} ${p.x} ${p.y})`);
    }
  });
}

/* ================= HUD ================= */
function updateHud(){
  scoreEl.textContent = score;
  hpEl.textContent = hp;
  const pct = Math.max(0, Math.min(1, hp / MAX_HP)) * 100;
  hpFillEl.style.width = pct + '%';
}
function updateCombo(){
  comboEl.textContent = combo > 0 ? combo : '';
}

/* ================= 判定 ================= */
function gradeFromDiff(diffSec, isDrag){
  if(isDrag){
    // drag 的 Good 合并进 Perfect
    if(diffSec <= goodWindow) return 'perfect';
    return null;
  }
  if(diffSec <= perfectWindow) return 'perfect';
  if(diffSec <= goodWindow) return 'good';
  return null;
}

function addHit(grade){
  combo++;
  if(combo>maxCombo) maxCombo = combo;
  if(grade === 'perfect'){ score += SCORE_PERFECT; perfectCount++; }
  else { score += SCORE_GOOD; goodCount++; }
  updateCombo();
  updateHud();
}

function addMiss(){
  combo = 0;
  missCount++;
  updateCombo();
  loseHp(HP_MISS);
}

/* rail 当前是否按住（键盘或触屏） */
function railHeld(rail){
  return heldKeys.has(rail) || heldRails.has(rail);
}

/* 判定：按下（t 判定 + hold 头判） */
function judgeKeyDown(letter){
  if(!chart || !running) return;
  const nowTime = currentTime;

  // t
  let bestT = null, bestTDiff = Infinity;
  for(const n of notes){
    if(n.type !== 'tap') continue;
    if(n.hit || n.missed) continue;
    if(n.rail !== letter) continue;
    const diff = Math.abs(t2s(n.time - nowTime));
    if(diff < bestTDiff){ bestTDiff = diff; bestT = n; }
  }
  if(bestT){
    const g = gradeFromDiff(bestTDiff, false);
    if(g){ bestT.hit = true; addHit(g); }
  }

  // hold 头判
  for(const n of notes){
    if(n.type !== 'hold') continue;
    if(n.headHit || n.failed) continue;
    if(n.rail !== letter) continue;
    const diff = Math.abs(t2s(n.startTime - nowTime));
    if(diff <= goodWindow){
      const g = gradeFromDiff(diff, false);
      if(g){
        n.headHit = true;
        n.active = true;
        addHit(g);
      }
      break;
    }
  }
}

/* 判定：每帧检查 drag + hold 中间/尾判 */
function checkContinuous(){
  const nowTime = currentTime;

  // drag
  for(const n of notes){
    if(n.type !== 'drag') continue;
    if(n.hit || n.missed) continue;
    const diff = Math.abs(t2s(n.time - nowTime));
    if(diff > goodWindow) continue;
    if(railHeld(n.rail)){
      n.hit = true;
      addHit('perfect');   // drag Good 合并进 Perfect
    }
  }

  // hold
  for(const n of notes){
    if(n.type !== 'hold') continue;
    if(n.done) continue;

    const t = n.duration;
    const effEnd = n.effEnd;

    // 中途：如果 active 且松开 → fail
    if(n.active && n.headHit && !n.failed){
      if(!railHeld(n.rail)){
        // 中途松手
        n.failed = true;
        n.done = true;
        n.active = false;
        addMiss();
        continue;
      }

      // 中间 combo 累加：从 startTime + 0.25 开始，每 0.25 一拍 +1，到 effEnd 为止
      // 计算已经过了多少个 0.25 拍
      const passed = Math.floor((nowTime - n.startTime) / 0.25);
      const target = Math.max(0, passed);
      // none 到 effEnd 截止
      let maxComboCount;
      if(n.endType === 'none'){
        maxComboCount = Math.floor((effEnd - n.startTime) / 0.25);
      } else {
        maxComboCount = Math.floor((n.endTime - n.startTime) / 0.25);
      }
      const capped = Math.min(target, maxComboCount);
      while(n.comboAcc < capped){
        n.comboAcc++;
        combo++;
        if(combo>maxCombo) maxCombo = combo;
        updateCombo();
      }

      // 尾判
      // 处理尾判窗口内“计数变化”
      const endCheck = (n.endType === 'none') ? effEnd : n.endTime;
      const tailDiff = t2s(nowTime - endCheck);   // 已过去的时间（正=已过）
      // 窗口：在 endCheck ± goodWindow 内
      if(nowTime >= endCheck - goodWindow && nowTime <= endCheck + goodWindow){
        // 记录窗口开始时计数
        if(n.tailCountAt === null){
          n.tailCountAt = holdCount.get(n.rail) || 0;
        }
        const cur = holdCount.get(n.rail) || 0;
        if(n.endType === 'out'){
          // 必须发生计数变化
          if(cur !== n.tailCountAt){
            // 变化发生：命中，按 tap 三档
            const diff = Math.abs(t2s(nowTime - endCheck));
            const g = gradeFromDiff(diff, false);
            if(g){ addHit(g); }
            n.done = true;
            n.active = false;
          }
        } else if(n.endType === 'free'){
          // free：不必须松手，窗口内直接算成功（用 drag 那套全 Perfect）
          if(nowTime >= endCheck){
            n.done = true;
            n.active = false;
            // 尾判命中 +1 combo
            combo++;
            if(combo>maxCombo) maxCombo = combo;
            updateCombo();
          }
        }
      }

      // 超过窗口还没触发 → miss
      if(!n.done && nowTime > endCheck + goodWindow){
        n.failed = true;
        n.done = true;
        n.active = false;
        addMiss();
      }
    }

    // 头判窗口已过还没按 → miss
    if(!n.headHit && !n.failed && !n.done){
      if(t2s(nowTime - n.startTime) > goodWindow){
        n.failed = true;
        n.done = true;
        addMiss();
      }
    }

    // none：到 effEnd 就算成功（如果头判命中且没松手）
    if(n.endType === 'none' && n.headHit && n.active && !n.failed && !n.done){
      if(nowTime >= effEnd){
        n.done = true;
        n.active = false;
      }
    }
  }
}

function loseHp(amount){
  hp += amount;
  if(hp <= 0){ hp = 0; updateHud(); endGame(); }
  else updateHud();
}

/* 超时 Miss：只针对 t / drag */
function autoMiss(){
  const nowTime = currentTime;
  for(const n of notes){
    if(n.type === 'hold') continue;
    if(n.hit || n.missed) continue;
    const th = (n.type === 'drag') ? goodWindow : goodWindow;
    if(t2s(nowTime - n.time) > th){
      n.missed = true;
      addMiss();
      if(!running) return;
    }
  }
}

/* ================= 结束与结算 ================= */
function allNotesDone(){
  for(const n of notes){
    if(n.type === 'hold'){
      if(!n.done) return false;
    } else {
      if(!n.hit && !n.missed) return false;
    }
  }
  return true;
}

let lastNoteTime = -Infinity;
function computeLastNoteTime(){
  let m = -Infinity;
  for(const n of notes){
    const end = (n.type === 'hold') ? n.endTime : n.time;
    if(end > m) m = end;
  }
  lastNoteTime = m;
}

function endGame(){
  if(!running) return;
  running = false;
  showResult();
}

function showResult(){
  let title;
  if(hp <= 0) title = 'LOST';
  else if(hp === MAX_HP) title = 'RECALL';
  else title = 'CLEAR';

  resultTitleEl.textContent = title;
  rScoreEl.textContent = score;
  rComboEl.textContent = maxCombo;
  rPerfectEl.textContent = perfectCount;
  rGoodEl.textContent = goodCount;
  rMissEl.textContent = missCount;
  resultEl.style.display = 'flex';
}

/* ================= 键盘 ================= */
function keyAdd(k){
  if(!heldKeys.has(k)){
    heldKeys.add(k);
    holdCount.set(k, (holdCount.get(k) || 0) + 1);
  }
}
function keyRemove(k){
  if(heldKeys.has(k)){
    heldKeys.delete(k);
    const n = (holdCount.get(k) || 0) - 1;
    if(n <= 0) holdCount.delete(k); else holdCount.set(k, n);
  }
}

document.addEventListener('keydown', e=>{
  const k = e.key.toUpperCase();
  if(k.length!==1 || k<'A' || k>'Z') return;
  if(!e.repeat){
    keyAdd(k);
    judgeKeyDown(k);
  }
});
document.addEventListener('keyup', e=>{
  const k = e.key.toUpperCase();
  if(k.length===1 && k>='A' && k<='Z') keyRemove(k);
});

/* ================= 触屏/鼠标 ================= */
function screenToSvg(clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const vbW = 800, vbH = 600;
  const scale = Math.min(rect.width / vbW, rect.height / vbH);
  const drawW = vbW * scale, drawH = vbH * scale;
  const offsetX = (rect.width - drawW) / 2;
  const offsetY = (rect.height - drawH) / 2;
  return {
    x: (clientX - rect.left - offsetX) / scale,
    y: (clientY - rect.top  - offsetY) / scale
  };
}

function railAtPoint(clientX, clientY){
  if(!chart) return null;
  const p = screenToSvg(clientX, clientY);
  const nowTime = currentTime;
  let bestRail = null, bestDist = Infinity;
  for(const l of lines){
    const g = lineGeom(l, nowTime);
    const railCount = l.rails.length;
    for(let i=0;i<railCount;i++){
      const c = railCenter(g, i, railCount);
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if(d <= TOUCH_RADIUS && d < bestDist){
        bestDist = d;
        bestRail = l.rails[i];
      }
    }
  }
  return bestRail;
}

function addRailHold(rail){
  const n = (railHoldCount.get(rail) || 0) + 1;
  railHoldCount.set(rail, n);
  heldRails.add(rail);
  holdCount.set(rail, (holdCount.get(rail) || 0) + 1);
}
function removeRailHold(rail){
  const n = (railHoldCount.get(rail) || 0) - 1;
  if(n <= 0){ railHoldCount.delete(rail); heldRails.delete(rail); }
  else railHoldCount.set(rail, n);
  const h = (holdCount.get(rail) || 0) - 1;
  if(h <= 0) holdCount.delete(rail); else holdCount.set(rail, h);
}

svg.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(!chart || !running) return;
  for(const t of e.changedTouches){
    const rail = railAtPoint(t.clientX, t.clientY);
    touchMap.set(t.identifier, rail);
    if(rail){
      addRailHold(rail);
      judgeKeyDown(rail);
    }
  }
}, {passive:false});

svg.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!chart || !running) return;
  for(const t of e.changedTouches){
    if(!touchMap.has(t.identifier)) continue;
    const oldRail = touchMap.get(t.identifier);
    const newRail = railAtPoint(t.clientX, t.clientY);
    if(oldRail === newRail) continue;
    if(oldRail) removeRailHold(oldRail);
    if(newRail) addRailHold(newRail);
    touchMap.set(t.identifier, newRail);
  }
}, {passive:false});

function endTouches(e){
  for(const t of e.changedTouches){
    if(!touchMap.has(t.identifier)) continue;
    const rail = touchMap.get(t.identifier);
    touchMap.delete(t.identifier);
    if(rail) removeRailHold(rail);
  }
}
svg.addEventListener('touchend', e=>{ e.preventDefault(); endTouches(e); }, {passive:false});
svg.addEventListener('touchcancel', e=>{ e.preventDefault(); endTouches(e); }, {passive:false});

svg.addEventListener('mousedown', e=>{
  if(!chart || !running) return;
  const rail = railAtPoint(e.clientX, e.clientY);
  if(rail){ addRailHold(rail); judgeKeyDown(rail); }
});
svg.addEventListener('mouseup', e=>{
  const rail = railAtPoint(e.clientX, e.clientY);
  if(rail) removeRailHold(rail);
});

/* ================= 主循环 ================= */
let currentTime = 0;
let lastTs = 0;
let running = false;

function loop(ts){
  if(!lastTs) lastTs = ts;
  const dtSec = (ts - lastTs)/1000;
  lastTs = ts;

  if(running){
    currentTime += s2t(dtSec);
    checkContinuous();
    autoMiss();

    if(allNotesDone() && t2s(currentTime - lastNoteTime) >= END_DELAY){
      endGame();
    }
    if(running) render(currentTime);
  }
  requestAnimationFrame(loop);
}

/* ================= 主页 / 导入 ================= */
document.getElementById('loadBtn').onclick = ()=>{
  let s = parseFloat(speedInput.value);
  if(isNaN(s)) s = 20;
  s = Math.max(5, Math.min(100, s));
  speedInput.value = s;
  noteSpeed = 10 * s;

  const idx = parseInt(modeSelect.value, 10) || 0;
  const mode = MODES[idx] || MODES[2];
  perfectWindow = mode.p / 1000;
  goodWindow = mode.g / 1000;

  fileInput.click();
};

fileInput.onchange = (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(reader.result,'application/xml');
      const c = parseChart(doc);
      buildRuntime(c);
      buildSvgForLines();
      computeLastNoteTime();

      score = 0;
      hp = MAX_HP;
      combo = 0; maxCombo = 0;
      perfectCount = 0; goodCount = 0; missCount = 0;
      heldKeys.clear();
      heldRails.clear();
      touchMap.clear();
      railHoldCount.clear();
      holdCount.clear();
      updateCombo();
      updateHud();

      homeEl.style.display = 'none';
      resultEl.style.display = 'none';

      currentTime = startTime();
      lastTs = 0;
      running = true;
      requestAnimationFrame(loop);
    }catch(ex){
      showErr('导入/初始化失败: ' + ex.message + '\n' + ex.stack);
    }
  };
  reader.onerror = ()=>{ showErr('文件读取失败'); };
  reader.readAsText(f);
};

document.getElementById('backBtn').onclick = ()=>{
  resultEl.style.display = 'none';
  homeEl.style.display = 'flex';

  svg.innerHTML = '';
  chart = null;
  notes = [];
  lines = [];
  points = {};
  svgLines = {};

  hp = MAX_HP;
  score = 0;
  combo = 0; maxCombo = 0;
  perfectCount = 0; goodCount = 0; missCount = 0;
  updateCombo();
  updateHud();

  fileInput.value = '';
};

homeEl.style.display = 'flex';
</script>
