<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AWGZ</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:monospace;color:#fff;}
  button{background:#222;color:#fff;border:1px solid #666;padding:6px 14px;
    cursor:pointer;font-family:monospace;}
  button:hover{background:#333;}
  #err{position:fixed;top:0;left:0;right:0;background:#a00;color:#fff;
    font-size:12px;padding:4px 8px;display:none;z-index:99;white-space:pre-wrap;}
  #wrap{position:relative;width:800px;height:600px;background:#000;max-width:100vw;}
  svg{display:block;width:800px;height:600px;background:#000;max-width:100vw;
    touch-action:none;-webkit-user-select:none;user-select:none;}

  #home{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#000;z-index:10;}
  #home h1{font-size:32px;margin:0 0 8px 0;letter-spacing:4px;}
  #home .row{display:flex;align-items:center;gap:8px;}
  #home input{width:80px;background:#111;color:#fff;border:1px solid #666;
    padding:6px;font-family:monospace;text-align:center;}
  #home .hint{font-size:12px;color:#888;}

  #combo{position:absolute;top:16px;left:0;width:100%;text-align:center;
    font-size:28px;color:#fff;pointer-events:none;text-shadow:0 0 6px #fff8;}
  #hud{position:absolute;left:12px;bottom:12px;pointer-events:none;
    font-size:16px;line-height:1.5;color:#fff;text-shadow:0 0 6px #000;}
  #hud .hpbar{width:120px;height:10px;border:1px solid #666;margin-top:2px;}
  #hud .hpfill{height:100%;background:#fff;width:100%;}

  #result{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;
    background:rgba(0,0,0,0.85);z-index:20;}
  #result h2{font-size:32px;margin:0 0 12px 0;letter-spacing:4px;}
  #result .line{font-size:18px;}
  #result button{margin-top:16px;}
</style>
</head>
<body>
<div id="err"></div>
<div id="wrap">
  <svg id="stage" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>

  <div id="combo"></div>
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>HP <span id="hp">80</span></div>
    <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
  </div>

  <div id="home">
    <h1>AWGZ</h1>
    <div class="row">
      <label>流速 s</label>
      <input id="speedInput" type="number" min="5" max="100" value="20">
    </div>
    <div class="hint">5 ~ 100，实际速度 = 10s px/s</div>
    <button id="loadBtn">导入谱面</button>
    <input id="fileInput" type="file" accept=".xml" style="display:none">
    <div class="hint" id="songName"></div>
  </div>

  <div id="result">
    <h2 id="resultTitle">RESULT</h2>
    <div class="line">SCORE <span id="rScore">0</span></div>
    <div class="line">MAX COMBO <span id="rCombo">0</span></div>
    <div class="line">PERFECT <span id="rPerfect">0</span></div>
    <div class="line">MISS <span id="rMiss">0</span></div>
    <button id="backBtn">确认</button>
  </div>
</div>

<script>
/* ===== 页面内错误显示 ===== */
const errEl = document.getElementById('err');
function showErr(msg){
  errEl.style.display = 'block';
  errEl.textContent = String(msg);
}
window.onerror = function(m, src, line, col){
  showErr('Error: ' + m + ' @' + line + ':' + col);
};

/* ================= 基础参数 ================= */
const HIT_WINDOW = 0.060;
const TOUCH_RADIUS = 100;

const MAX_HP = 80;
const SCORE_PERFECT = 5;
const HP_MISS = -5;
const END_DELAY = 1.0;

let noteSpeed = 200;

const svg = document.getElementById('stage');
const comboEl = document.getElementById('combo');
const songNameEl = document.getElementById('songName');
const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');
const hpFillEl = document.getElementById('hpfill');

const homeEl = document.getElementById('home');
const resultEl = document.getElementById('result');
const resultTitleEl = document.getElementById('resultTitle');
const rScoreEl = document.getElementById('rScore');
const rComboEl = document.getElementById('rCombo');
const rPerfectEl = document.getElementById('rPerfect');
const rMissEl = document.getElementById('rMiss');
const speedInput = document.getElementById('speedInput');
const fileInput = document.getElementById('fileInput');

let chart = null;
let points = {};
let lines  = [];
let taps   = [];

let score = 0;
let hp = MAX_HP;
let combo = 0, maxCombo = 0;
let perfectCount = 0, missCount = 0;

const heldKeys = new Set();
const heldRails = new Set();
const touchMap = new Map();
const railHoldCount = new Map();

function t2s(t){ return t * 60 / chart.bpm; }
function s2t(s){ return s * chart.bpm / 60; }
function startTime(){ return -chart.bpm / 30; }

/* ================= 解析 XML ================= */
function parseChart(xmlDoc){
  const root = xmlDoc.querySelector('data');
  const c = {
    name: root.getAttribute('name') || '',
    bpm: parseFloat(root.getAttribute('bpm')) || 60,
    points: {},
    lines: [],
    taps: [],
    events: []
  };

  root.querySelectorAll('points > p').forEach(p=>{
    c.points[p.getAttribute('id')] = {
      x: parseFloat(p.getAttribute('x')),
      y: parseFloat(p.getAttribute('y')),
      moves: []
    };
  });

  root.querySelectorAll('lines > line').forEach(l=>{
    c.lines.push({
      id: l.getAttribute('id'),
      start: l.getAttribute('start'),
      end: l.getAttribute('end'),
      rails: (l.getAttribute('rails')||'').trim().split(/\s+/).filter(Boolean),
      alpha: l.hasAttribute('alpha') ? parseFloat(l.getAttribute('alpha')) : 1,
      railBorderAlpha: l.hasAttribute('railBorderAlpha') ? parseFloat(l.getAttribute('railBorderAlpha')) : 0.5
    });
  });

  root.querySelectorAll('taps > t, taps > d').forEach(el=>{
    const isDrag = el.tagName.toLowerCase() === 'd';
    c.taps.push({
      line: el.getAttribute('online'),
      rail: el.getAttribute('onrail'),
      time: parseFloat(el.getAttribute('time')),
      type: isDrag ? 'drag' : 'tap'
    });
  });

  root.querySelectorAll('events > pointmove').forEach(m=>{
    c.events.push({
      kind: 'pointmove',
      obj: m.getAttribute('obj'),
      startTime: parseFloat(m.getAttribute('startTime')),
      endTime: parseFloat(m.getAttribute('endTime')),
      toX: parseFloat(m.getAttribute('toX')),
      toY: parseFloat(m.getAttribute('toY'))
    });
  });

  root.querySelectorAll('events > lineAlphaChange').forEach(el=>{
    c.events.push({
      kind: 'lineAlphaChange',
      startTime: parseFloat(el.getAttribute('startTime')),
      endTime: parseFloat(el.getAttribute('endTime')),
      endAlpha: parseFloat(el.getAttribute('endAlpha'))
    });
  });

  root.querySelectorAll('events > railBorderAlphaChange').forEach(el=>{
    c.events.push({
      kind: 'railBorderAlphaChange',
      startTime: parseFloat(el.getAttribute('startTime')),
      endTime: parseFloat(el.getAttribute('endTime')),
      endAlpha: parseFloat(el.getAttribute('endAlpha'))
    });
  });

  return c;
}

/* ================= 初始化运行时 ================= */
function buildRuntime(c){
  chart = c;
  points = {};
  for(const id in c.points){
    points[id] = { x:c.points[id].x, y:c.points[id].y,
                   baseX:c.points[id].x, baseY:c.points[id].y, moves:[] };
  }
  c.events.forEach(e=>{
    if(e.kind==='pointmove' && points[e.obj]) points[e.obj].moves.push(e);
  });
  for(const id in points){
    points[id].moves.sort((a,b)=>a.startTime-b.startTime);
  }

  lines = c.lines.map(l=>{
    const alphaEvents = c.events
      .filter(e=>e.kind==='lineAlphaChange')
      .sort((a,b)=>a.startTime-b.startTime);
    const rbEvents = c.events
      .filter(e=>e.kind==='railBorderAlphaChange')
      .sort((a,b)=>a.startTime-b.startTime);
    return {
      id: l.id, startId: l.start, endId: l.end, rails: l.rails.slice(),
      baseAlpha: l.alpha,
      baseRailBorderAlpha: l.railBorderAlpha,
      alpha: l.alpha,
      railBorderAlpha: l.railBorderAlpha,
      alphaEvents,
      railBorderAlphaEvents: rbEvents
    };
  });

  taps = c.taps.map(t=>({
    lineId: t.line,
    rail: t.rail,
    time: t.time,
    type: t.type,
    hit: false,
    missed: false,
    el: null
  }));

  songNameEl.textContent = c.name ? (c.name + '  BPM:' + c.bpm) : '';
}

/* ================= 点位置 ================= */
function pointPos(p, nowTime){
  let x = p.baseX, y = p.baseY;
  for(const m of p.moves){
    if(nowTime <= m.startTime) break;
    if(nowTime >= m.endTime){ x = m.toX; y = m.toY; continue; }
    const span = m.endTime - m.startTime;
    const k = span<=0 ? 1 : (nowTime - m.startTime)/span;
    x = x + (m.toX - x) * k;
    y = y + (m.toY - y) * k;
    break;
  }
  return {x,y};
}

function applyAlphaEvents(base, events, nowTime){
  let val = base;
  for(const e of events){
    if(nowTime <= e.startTime) break;
    if(nowTime >= e.endTime){ val = e.endAlpha; continue; }
    const span = e.endTime - e.startTime;
    const k = span<=0 ? 1 : (nowTime - e.startTime)/span;
    val = val + (e.endAlpha - val) * k;
    break;
  }
  return val;
}

/* ================= 判定线几何 ================= */
function lineGeom(line, nowTime){
  const p0 = pointPos(points[line.startId], nowTime);
  const p1 = pointPos(points[line.endId], nowTime);
  let dx = p1.x - p0.x, dy = p1.y - p0.y;
  let len = Math.hypot(dx,dy);
  if(len < 1e-6){ dx=1; dy=0; len=1; }
  const ux = dx/len, uy = dy/len;
  const vx = -uy, vy = ux;
  return {p0,p1,ux,uy,vx,vy,len};
}

function railCenter(g, railIndex, railCount){
  const seg = g.len / railCount;
  const d = seg * (railIndex + 0.5);
  return { x: g.p0.x + g.ux*d, y: g.p0.y + g.uy*d };
}

/* ================= 渲染 ================= */
let svgLines = {};

function buildSvgForLines(){
  svg.innerHTML = '';
  svgLines = {};
  lines.forEach(l=>{
    const railCount = l.rails.length;

    const lineEl = document.createElementNS('http://www.w3.org/2000/svg','line');
    lineEl.setAttribute('stroke','#fff');
    lineEl.setAttribute('stroke-width','2');
    svg.appendChild(lineEl);

    const borders = [];
    for(let i=0;i<=railCount;i++){
      const el = document.createElementNS('http://www.w3.org/2000/svg','line');
      el.setAttribute('stroke','#808080');
      el.setAttribute('stroke-width','1');
      svg.appendChild(el);
      borders.push(el);
    }

    const railLabels = [];
    const g0 = lineGeom(l, startTime());
    l.rails.forEach((letter, i)=>{
      const el = document.createElementNS('http://www.w3.org/2000/svg','text');
      el.textContent = letter;
      el.setAttribute('fill','#fff');
      el.setAttribute('font-size','14');
      el.setAttribute('font-family','monospace');
      el.setAttribute('text-anchor','middle');
      el.setAttribute('dominant-baseline','middle');
      const c0 = railCenter(g0, i, railCount);
      el.setAttribute('x', c0.x);
      el.setAttribute('y', c0.y);
      svg.appendChild(el);
      railLabels.push(el);
    });

    taps.forEach(tap=>{
      if(tap.lineId !== l.id) return;
      const el = document.createElementNS('http://www.w3.org/2000/svg','rect');
      el.setAttribute('fill','#fff');
      el.setAttribute('opacity','0');
      svg.appendChild(el);
      tap.el = el;
    });

    svgLines[l.id] = { lineEl, borders, railLabels, railCount };
  });
}

const FAR = 5000;
function setInfiniteLine(el, cx, cy, ux, uy){
  el.setAttribute('x1', cx - ux*FAR);
  el.setAttribute('y1', cy - uy*FAR);
  el.setAttribute('x2', cx + ux*FAR);
  el.setAttribute('y2', cy + uy*FAR);
}

function render(nowTime){
  for(const l of lines){
    const g = lineGeom(l, nowTime);
    const store = svgLines[l.id];
    if(!store) continue;
    const railCount = store.railCount;

    l.alpha = applyAlphaEvents(l.baseAlpha, l.alphaEvents, nowTime);
    l.railBorderAlpha = applyAlphaEvents(l.baseRailBorderAlpha, l.railBorderAlphaEvents, nowTime);

    store.lineEl.setAttribute('opacity', l.alpha);
    store.borders.forEach(b=>{
      b.setAttribute('stroke', 'rgba(128,128,128,' + l.railBorderAlpha + ')');
    });

    setInfiniteLine(store.lineEl, g.p0.x, g.p0.y, g.ux, g.uy);

    const seg = g.len / railCount;
    for(let i=0;i<=railCount;i++){
      const d = seg * i;
      const bx = g.p0.x + g.ux*d;
      const by = g.p0.y + g.uy*d;
      const el = store.borders[i];
      el.setAttribute('x1', bx - g.vx*FAR);
      el.setAttribute('y1', by - g.vy*FAR);
      el.setAttribute('x2', bx + g.vx*FAR);
      el.setAttribute('y2', by + g.vy*FAR);
    }

    for(let i=0;i<railCount;i++){
      const c = railCenter(g, i, railCount);
      const el = store.railLabels[i];
      el.setAttribute('x', c.x);
      el.setAttribute('y', c.y);
    }
  }

  taps.forEach(tap=>{
    const el = tap.el;
    if(!el) return;
    if(tap.hit || tap.missed){ el.setAttribute('opacity','0'); return; }

    const l = lines.find(x=>x.id===tap.lineId);
    if(!l){ el.setAttribute('opacity','0'); return; }
    const g = lineGeom(l, nowTime);
    const railCount = l.rails.length;
    const railIndex = l.rails.indexOf(tap.rail);
    if(railIndex < 0){ el.setAttribute('opacity','0'); return; }

    const center = railCenter(g, railIndex, railCount);
    const rectW = g.len / railCount;
    const rectH = tap.type === 'drag' ? rectW / 15 : rectW / 6;

    const dtSec = t2s(tap.time - nowTime);
    const dist = noteSpeed * dtSec;

    const ncx = center.x - g.vx * dist;
    const ncy = center.y - g.vy * dist;

    el.setAttribute('x', ncx - rectW/2);
    el.setAttribute('y', ncy - rectH/2);
    el.setAttribute('width', rectW);
    el.setAttribute('height', rectH);
    el.setAttribute('opacity','1');

    const ang = Math.atan2(g.uy, g.ux) * 180/Math.PI;
    el.setAttribute('transform', `rotate(${ang} ${ncx} ${ncy})`);
  });
}

/* ================= HUD ================= */
function updateHud(){
  scoreEl.textContent = score;
  hpEl.textContent = hp;
  const pct = Math.max(0, Math.min(1, hp / MAX_HP)) * 100;
  hpFillEl.style.width = pct + '%';
}
function updateCombo(){
  comboEl.textContent = combo > 0 ? combo : '';
}

/* ================= 判定 ================= */
function hitTap(tap){
  tap.hit = true;
  combo++;
  if(combo>maxCombo) maxCombo = combo;
  score += SCORE_PERFECT;
  perfectCount++;
  updateCombo();
  updateHud();
}

function judgeKeyDown(letter){
  if(!chart || !running) return;
  const nowTime = currentTime;
  let best = null, bestDiff = Infinity;
  for(const tap of taps){
    if(tap.hit || tap.missed) continue;
    if(tap.type !== 'tap') continue;
    if(tap.rail !== letter) continue;
    const diff = Math.abs(t2s(tap.time - nowTime));
    if(diff < bestDiff){ bestDiff = diff; best = tap; }
  }
  if(best && bestDiff <= HIT_WINDOW) hitTap(best);
}

function checkDrags(){
  const nowTime = currentTime;
  for(const tap of taps){
    if(tap.hit || tap.missed) continue;
    if(tap.type !== 'drag') continue;
    const diff = Math.abs(t2s(tap.time - nowTime));
    if(diff > HIT_WINDOW) continue;
    if(heldKeys.has(tap.rail) || heldRails.has(tap.rail)){
      hitTap(tap);
    }
  }
}

function loseHp(amount){
  hp += amount;
  if(hp <= 0){ hp = 0; updateHud(); endGame(); }
  else updateHud();
}

function autoMiss(){
  const nowTime = currentTime;
  for(const tap of taps){
    if(tap.hit || tap.missed) continue;
    if(t2s(nowTime - tap.time) > HIT_WINDOW){
      tap.missed = true;
      combo = 0;
      missCount++;
      updateCombo();
      loseHp(HP_MISS);
      if(!running) return;
    }
  }
}

/* ================= 结束与结算 ================= */
function allNotesDone(){
  for(const tap of taps){
    if(!tap.hit && !tap.missed) return false;
  }
  return true;
}

let lastNoteTime = -Infinity;
function computeLastNoteTime(){
  let m = -Infinity;
  for(const tap of taps) if(tap.time > m) m = tap.time;
  lastNoteTime = m;
}

function endGame(){
  if(!running) return;
  running = false;
  showResult();
}

function showResult(){
  // 标题：hp<=0 -> LOST；hp==80 -> RECALL；否则 CLEAR
  let title;
  if(hp <= 0) title = 'LOST';
  else if(hp === MAX_HP) title = 'RECALL';
  else title = 'CLEAR';

  resultTitleEl.textContent = title;
  rScoreEl.textContent = score;
  rComboEl.textContent = maxCombo;
  rPerfectEl.textContent = perfectCount;
  rMissEl.textContent = missCount;
  resultEl.style.display = 'flex';
}

/* ================= 键盘 ================= */
document.addEventListener('keydown', e=>{
  const k = e.key.toUpperCase();
  if(k.length!==1 || k<'A' || k>'Z') return;
  if(!e.repeat){
    heldKeys.add(k);
    judgeKeyDown(k);
  }
});
document.addEventListener('keyup', e=>{
  const k = e.key.toUpperCase();
  if(k.length===1 && k>='A' && k<='Z') heldKeys.delete(k);
});

/* ================= 触屏/鼠标 ================= */
function screenToSvg(clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const vbW = 800, vbH = 600;
  const scale = Math.min(rect.width / vbW, rect.height / vbH);
  const drawW = vbW * scale, drawH = vbH * scale;
  const offsetX = (rect.width - drawW) / 2;
  const offsetY = (rect.height - drawH) / 2;
  return {
    x: (clientX - rect.left - offsetX) / scale,
    y: (clientY - rect.top  - offsetY) / scale
  };
}

function railAtPoint(clientX, clientY){
  if(!chart) return null;
  const p = screenToSvg(clientX, clientY);
  const nowTime = currentTime;
  let bestRail = null, bestDist = Infinity;
  for(const l of lines){
    const g = lineGeom(l, nowTime);
    const railCount = l.rails.length;
    for(let i=0;i<railCount;i++){
      const c = railCenter(g, i, railCount);
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if(d <= TOUCH_RADIUS && d < bestDist){
        bestDist = d;
        bestRail = l.rails[i];
      }
    }
  }
  return bestRail;
}

function addRailHold(rail){
  const n = (railHoldCount.get(rail) || 0) + 1;
  railHoldCount.set(rail, n);
  heldRails.add(rail);
}
function removeRailHold(rail){
  const n = (railHoldCount.get(rail) || 0) - 1;
  if(n <= 0){
    railHoldCount.delete(rail);
    heldRails.delete(rail);
  } else {
    railHoldCount.set(rail, n);
  }
}

svg.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(!chart || !running) return;
  for(const t of e.changedTouches){
    const rail = railAtPoint(t.clientX, t.clientY);
    if(!rail) continue;
    touchMap.set(t.identifier, rail);
    addRailHold(rail);
    judgeKeyDown(rail);
  }
}, {passive:false});

function endTouches(e){
  for(const t of e.changedTouches){
    const rail = touchMap.get(t.identifier);
    if(rail === undefined) continue;
    touchMap.delete(t.identifier);
    removeRailHold(rail);
  }
}
svg.addEventListener('touchend', e=>{ e.preventDefault(); endTouches(e); }, {passive:false});
svg.addEventListener('touchcancel', e=>{ endTouches(e); }, {passive:false});

svg.addEventListener('mousedown', e=>{
  if(!chart || !running) return;
  const rail = railAtPoint(e.clientX, e.clientY);
  if(rail){ addRailHold(rail); judgeKeyDown(rail); }
});
svg.addEventListener('mouseup', e=>{
  const rail = railAtPoint(e.clientX, e.clientY);
  if(rail) removeRailHold(rail);
});

/* ================= 主循环 ================= */
let currentTime = 0;
let lastTs = 0;
let running = false;

function loop(ts){
  if(!lastTs) lastTs = ts;
  const dtSec = (ts - lastTs)/1000;
  lastTs = ts;

  if(running){
    currentTime += s2t(dtSec);
    checkDrags();
    autoMiss();

    if(allNotesDone() && t2s(currentTime - lastNoteTime) >= END_DELAY){
      endGame();
    }
    if(running) render(currentTime);
  }
  requestAnimationFrame(loop);
}

/* ================= 主页 / 导入 ================= */
document.getElementById('loadBtn').onclick = ()=>{
  let s = parseFloat(speedInput.value);
  if(isNaN(s)) s = 20;
  s = Math.max(5, Math.min(100, s));
  speedInput.value = s;
  noteSpeed = 10 * s;
  fileInput.click();
};

fileInput.onchange = (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(reader.result,'application/xml');
      const c = parseChart(doc);
      buildRuntime(c);
      buildSvgForLines();
      computeLastNoteTime();

      score = 0;
      hp = MAX_HP;
      combo = 0; maxCombo = 0;
      perfectCount = 0; missCount = 0;
      heldKeys.clear();
      heldRails.clear();
      touchMap.clear();
      railHoldCount.clear();
      updateCombo();
      updateHud();

      homeEl.style.display = 'none';
      resultEl.style.display = 'none';

      currentTime = startTime();
      lastTs = 0;
      running = true;
      requestAnimationFrame(loop);
    }catch(ex){
      showErr('导入/初始化失败: ' + ex.message + '\n' + ex.stack);
    }
  };
  reader.onerror = ()=>{ showErr('文件读取失败'); };
  reader.readAsText(f);
};

document.getElementById('backBtn').onclick = ()=>{
  resultEl.style.display = 'none';
  homeEl.style.display = 'flex';

  // 清空画面
  svg.innerHTML = '';
  chart = null;
  taps = [];
  lines = [];
  points = {};
  svgLines = {};

  // HP 恢复 80
  hp = MAX_HP;
  score = 0;
  combo = 0; maxCombo = 0;
  perfectCount = 0; missCount = 0;
  updateCombo();
  updateHud();

  // 关键修复：清空 fileInput，允许再次选同一个文件
  fileInput.value = '';
};

homeEl.style.display = 'flex';
</script>
</body>
</html>
